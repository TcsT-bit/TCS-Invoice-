<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Twinz Cooperate Services Pty Ltd - Invoice</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  body { font-family: 'Inter', sans-serif; }
  @media print {.no-print { display: none; } }
</style>
</head>
<body class="bg-gray-100">
<div id="root"></div>

<script type="text/babel">
const { useState, useRef } = React;
const { jsPDF } = window.jspdf;

// REPLACE THIS with your logo base64.
// To get it: open the image in browser, right-click > Open Image in New Tab > use an online image to base64 converter
const LOGO_BASE64 = "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD...";

function App() {
  const invoiceRef = useRef();
  const [mode, setMode] = useState('edit');
  const [invoice, setInvoice] = useState({
    company: "Twinz Cooperate Services Pty Ltd",
    companyReg: "2024/444303/07",
    vatNo: "9819040198",
    companyAddress: "",
    companyEmail: "",
    companyPhone: "",
    bankName: "Standard Bank",
    accountNumber: "10 26 459 443 4",
    branchCode: "006145",
    logo: LOGO_BASE64,

    invoiceNumber: "042",
    invoiceDate: "2024-03-21",
    dueDate: "",
    status: "Unpaid", // Unpaid, Paid, Partially Paid
    receivedAmount: 0,

    clientName: "",
    clientEmail: "",
    clientPhone: "",
    clientAddress: "",

    items: [{ desc: "", qty: 1, rate: 0 }],
    taxRate: 15,
    notes: "Quotation accepted refer to Ts & Cs below",
    terms: `Storage fees are charged after 7 business days grace period following the completion of work and storage fee will also apply to clients who leave their vehicle on premises prior to the job after diagnostics have been performed.`,
    signatureName: "",
    signatureDate: "",
  });

  const handleItemChange = (i, field, value) => {
    const newItems = [...invoice.items];
    newItems[i][field] = field === "desc"? value : Number(value);
    setInvoice({...invoice, items: newItems });
  };

  const addItem = () => setInvoice({...invoice, items: [...invoice.items, { desc: "", qty: 1, rate: 0 }] });
  const removeItem = (i) => setInvoice({...invoice, items: invoice.items.filter((_, idx) => idx!== i) });

  const subtotal = invoice.items.reduce((sum, i) => sum + i.qty * i.rate, 0);
  const tax = subtotal * (invoice.taxRate / 100);
  const total = subtotal + tax;
  const balanceDue = Math.max(0, total - invoice.receivedAmount);

  const generatePDF = () => {
    const doc = new jsPDF('p', 'mm', 'a4');
    return doc.html(invoiceRef.current, {
      x: 0, y: 0, width: 210, windowWidth: 800
    }).then(() => doc);
  };

  const downloadPDF = async () => {
    const doc = await generatePDF();
    doc.save(`${invoice.invoiceNumber}_Twinz_Cooperate_Services.pdf`);
  };

  const shareWhatsApp = async () => {
    const message = `Invoice ${invoice.invoiceNumber} from ${invoice.company}\nClient: ${invoice.clientName}\nAmount Due: ZAR ${balanceDue.toFixed(2)}\n\nPlease find the attached invoice PDF.`;
    const url = `https://wa.me/?text=${encodeURIComponent(message)}`;
    window.open(url, '_blank');
    alert("PDF will download. Attach it manually to the WhatsApp chat that opens.");
    await downloadPDF();
  };

  const shareEmail = async () => {
    const subject = `Invoice ${invoice.invoiceNumber} - ${invoice.company}`;
    const body = `Dear ${invoice.clientName},\n\nPlease find attached invoice ${invoice.invoiceNumber} for ZAR ${balanceDue.toFixed(2)}.\n\nThank you,\n${invoice.company}`;
    const mailto = `mailto:${invoice.clientEmail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    window.location.href = mailto;
    alert("PDF will download. Attach it to the email that opens.");
    await downloadPDF();
  };

  const getStatusColor = () => {
    if (invoice.status === "Paid") return "bg-green-100 text-green-700";
    if (invoice.status === "Partially Paid") return "bg-yellow-100 text-yellow-700";
    return "bg-red-100 text-red-700";
  };

  return (
    <div className="min-h-screen py-8">
      {/* Top Bar */}
      <div className="max-w-5xl mx-auto px-6 mb-4 no-print">
        <div className="flex flex-col md:flex-row justify-between items-center gap-4">
          <h1 className="text-2xl font-bold text-gray-800">Invoice Generator</h1>
          <div className="flex flex-wrap gap-2">
            <button onClick={() => setMode(mode === 'edit'? 'preview' : 'edit')}
              className="px-4 py-2 rounded-lg border bg-white hover:bg-gray-50">
              {mode === 'edit'? 'Preview' : 'Edit'}
            </button>
            <button onClick={downloadPDF}
              className="px-4 py-2 rounded-lg bg-black text-white hover:bg-gray-800">
              Download PDF
            </button>
            <button onClick={shareWhatsApp}
              className="px-4 py-2 rounded-lg bg-green-600 text-white hover:bg-green-700">
              Share WhatsApp
            </button>
            <button onClick={shareEmail}
              className="px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700">
              Send Email
            </button>
          </div>
        </div>
      </div>

      {/* Invoice Card */}
      <div className="max-w-5xl mx-auto px-6">
        <div ref={invoiceRef} className="bg-white shadow-lg rounded-xl p-10">

          {/* Header */}
          <div className="flex flex-col md:flex-row justify-between items-start mb-8">
            <div className="flex items-start gap-4">
              {invoice.logo && <img src={invoice.logo} className="h-16 w-auto object-contain" />}
              <div>
                <h2 className="text-2xl font-bold">{invoice.company}</h2>
                <p className="text-sm text-gray-600">Reg No: {invoice.companyReg}</p>
                <p className="text-sm text-gray-600">VAT No: {invoice.vatNo}</p>
                <p className="text-sm text-gray-600 mt-1">{invoice.companyAddress}</p>
                <p className="text-sm text-gray-600">{invoice.companyEmail} | {invoice.companyPhone}</p>
              </div>
            </div>
            <div className="text-right mt-4 md:mt-0">
              <h1 className="text-4xl font-bold text-gray-800">INVOICE</h1>
              <p className="text-gray-600 mt-2">#{invoice.invoiceNumber}</p>
              <span className={`inline-block mt-2 px-3 py-1 rounded-full text-sm font-medium ${getStatusColor()}`}>
                {invoice.status}
              </span>
            </div>
          </div>

          {/* Status Bar */}
          <div className="bg-gray-50 rounded-lg p-4 mb-6 grid md:grid-cols-3 gap-4">
            <div>
              <p className="text-sm text-gray-500">Received</p>
              <p className="font-semibold">ZAR {invoice.receivedAmount.toFixed(2)}</p>
            </div>
            <div>
              <p className="text-sm text-gray-500">Issued</p>
              <p className="font-semibold">{new Date(invoice.invoiceDate).toLocaleDateString('en-GB', {month: 'short', day: 'numeric'})}</p>
            </div>
            <div>
              <p className="text-sm text-gray-500">Balance Due</p>
              <p className="font-bold text-xl text-gray-900">ZAR {balanceDue.toFixed(2)}</p>
            </div>
          </div>

          {/* Bill To & Invoice Info */}
          <div className="grid md:grid-cols-2 gap-8 mb-8">
            <div>
              <p className="text-sm text-gray-500 mb-1">Bill To</p>
              <p className="font-semibold">{invoice.clientName || 'Client Name'}</p>
              <p className="text-sm">{invoice.clientAddress}</p>
              <p className="text-sm">{invoice.clientEmail}</p>
              <p className="text-sm">{invoice.clientPhone}</p>
            </div>
            <div className="text-right">
              <p className="text-sm text-gray-500">Invoice Date</p>
              <p className="font-semibold">{invoice.invoiceDate}</p>
              <p className="text-sm text-gray-500 mt-2">Due Date</p>
              <p className="font-semibold">{invoice.dueDate || '-'}</p>
            </div>
          </div>

          {/* Items Table */}
          <div className="mb-8 overflow-x-auto">
            <table className="w-full text-sm">
              <thead className="bg-gray-50">
                <tr>
                  <th className="text-left p-3 font-semibold">Description</th>
                  <th className="text-right p-3 font-semibold">Qty</th>
                  <th className="text-right p-3 font-semibold">Rate</th>
                  <th className="text-right p-3 font-semibold">Amount</th>
                </tr>
              </thead>
              <tbody>
                {invoice.items.map((item, i) => (
                  <tr key={i} className="border-b">
                    <td className="p-3">{item.desc || '-'}</td>
                    <td className="p-3 text-right">{item.qty}</td>
                    <td className="p-3 text-right">ZAR {item.rate.toFixed(2)}</td>
                    <td className="p-3 text-right font-medium">ZAR {(item.qty * item.rate).toFixed(2)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {/* Totals */}
          <div className="flex justify-end mb-8">
            <div className="w-72 space-y-2">
              <div className="flex justify-between text-sm">
                <span>Subtotal</span>
                <span>ZAR {subtotal.toFixed(2)}</span>
              </div>
              <div className="flex justify-between text-sm">
                <span>VAT {invoice.taxRate}%</span>
                <span>ZAR {tax.toFixed(2)}</span>
              </div>
              <div className="flex justify-between text-sm">
                <span>Received</span>
                <span>- ZAR {invoice.receivedAmount.toFixed(2)}</span>
              </div>
              <div className="flex justify-between font-bold text-lg border-t pt-2">
                <span>Balance Due</span>
                <span>ZAR {balanceDue.toFixed(2)}</span>
              </div>
            </div>
          </div>

          {/* Bank Details */}
          <div className="bg-gray-50 rounded-lg p-4 mb-6">
            <p className="font-semibold mb-2">Payment Details</p>
            <p className="text-sm">{invoice.bankName}</p>
            <p className="text-sm">Account Number: {invoice.accountNumber}</p>
            <p className="text-sm">Branch Code: {invoice.branchCode}</p>
          </div>

          {/* Notes & Terms */}
          <div className="mb-8">
            <p className="font-semibold mb-2">Notes</p>
            <p className="text-sm text-gray-700 mb-4">{invoice.notes}</p>
            <p className="font-semibold mb-2">Terms & Conditions</p>
            <p className="text-sm text-gray-700 whitespace-pre-line">{invoice.terms}</p>
          </div>

          {/* Signature */}
          <div className="grid md:grid-cols-3 gap-8 pt-8 border-t">
            <div>
              <p className="text-sm text-gray-500">Name</p>
              <p className="border-b border-gray-300 mt-4">{invoice.signatureName}</p>
            </div>
            <div>
              <p className="text-sm text-gray-500">Date</p>
              <p className="border-b border-gray-300 mt-4">{invoice.signatureDate}</p>
            </div>
            <div>
              <p className="text-sm text-gray-500">Signature</p>
              <p className="border-b border-gray-300 mt-4 h-8"></p>
            </div>
          </div>
        </div>
      </div>

      {/* Edit Form */}
      {mode === 'edit' && (
        <div className="max-w-5xl mx-auto px-6 mt-8 no-print">
          <div className="bg-white shadow rounded-xl p-6 space-y-6">

            <div className="grid md:grid-cols-2 gap-4">
              <div>
                <label className="block text-sm font-medium mb-2">Status</label>
                <select value={invoice.status} onChange={e => setInvoice({...invoice, status: e.target.value})}
                  className="border p-2 rounded w-full">
                  <option>Unpaid</option>
                  <option>Partially Paid</option>
                  <option>Paid</option>
                </select>
              </div>
              <div>
                <label className="block text-sm font-medium mb-2">Received Amount</label>
                <input type="number" value={invoice.receivedAmount}
                  onChange={e => setInvoice({...invoice, receivedAmount: Number(e.target.value)})}
                  className="border p-2 rounded w-full" />
              </div>
            </div>

            {/* Company Details */}
            <div>
              <h3 className="font-semibold mb-3">Company Details</h3>
              <div className="grid md:grid-cols-2 gap-4">
                <input className="border p-2 rounded" placeholder="Company Name" value={invoice.company}
                  onChange={e => setInvoice({...invoice, company: e.target.value})} />
                <input className="border p-2 rounded" placeholder="Reg No" value={invoice.companyReg}
                  onChange={e => setInvoice({...invoice, companyReg: e.target.value})} />
                <input className="border p-2 rounded" placeholder="VAT No" value={invoice.vatNo}
                  onChange={e => setInvoice({...invoice, vatNo: e.target.value})} />
                <input className="border p-2 rounded" placeholder="Address" value={invoice.companyAddress}
                  onChange={e => setInvoice({...invoice, companyAddress: e.target.value})} />
                <input className="border p-2 rounded" placeholder="Email" value={invoice.companyEmail}
                  onChange={e => setInvoice({...invoice, companyEmail: e.target.value})} />
                <input className="border p-2 rounded" placeholder="Phone" value={invoice.companyPhone}
                  onChange={e => setInvoice({...invoice, companyPhone: e.target.value})} />
              </div>
            </div>

            {/* Bank Details */}
            <div>
              <h3 className="font-semibold mb-3">Bank Details</h3>
              <div className="grid md:grid-cols-3 gap-4">
                <input className="border p-2 rounded" placeholder="Bank" value={invoice.bankName}
                  onChange={e => setInvoice({...invoice, bankName: e.target.value})} />
                <input className="border p-2 rounded" placeholder="Account Number" value={invoice.accountNumber}
                  onChange={e => setInvoice({...invoice, accountNumber: e.target.value})} />
                <input className="border p-2 rounded" placeholder="Branch Code" value={invoice.branchCode}
                  onChange={e => setInvoice({...invoice, branchCode: e.target.value})} />
              </div>
            </div>

            {/* Invoice Details */}
            <div>
              <h3 className="font-semibold mb-3">Invoice Details</h3>
              <div className="grid md:grid-cols-4 gap-4">
                <input className="border p-2 rounded" placeholder="Invoice #" value={invoice.invoiceNumber}
                  onChange={e => setInvoice({...invoice, invoiceNumber: e.target.value})} />
                <input type="date" className="border p-2 rounded" value={invoice.invoiceDate}
                  onChange={e => setInvoice({...invoice, invoiceDate: e.target.value})} />
                <input type="date" className="border p-2 rounded" value={invoice.dueDate}
                  onChange={e => setInvoice({...invoice, dueDate: e.target.value})} />
              </div>
            </div>

            {/* Client Details */}
            <div>
              <h3 className="font-semibold mb-3">Client Details</h3>
              <div className="grid md:grid-cols-2 gap-4">
                <input className="border p-2 rounded" placeholder="Client Name" value={invoice.clientName}
                  onChange={e => setInvoice({...invoice, clientName: e.target.value})} />
                <input className="border p-2 rounded" placeholder="Client Email" value={invoice.clientEmail}
                  onChange={e => setInvoice({...invoice, clientEmail: e.target.value})} />
                <input className="border p-2 rounded" placeholder="Client Phone" value={invoice.clientPhone}
                  onChange={e => setInvoice({...invoice, clientPhone: e.target.value})} />
                <input className="border p-2 rounded" placeholder="Client Address" value={invoice.clientAddress}
                  onChange={e => setInvoice({...invoice, clientAddress: e.target.value})} />
              </div>
            </div>

            {/* Items */}
            <div>
              <h3 className="font-semibold mb-3">Items</h3>
              {invoice.items.map((item, i) => (
                <div key={i} className="grid grid-cols-12 gap-2 mb-2">
                  <input placeholder="Description" value={item.desc}
                    onChange={e => handleItemChange(i, "desc", e.target.value)}
                    className="border p-2 rounded col-span-6" />
                  <input type="number" min="0" placeholder="Qty" value={item.qty}
                    onChange={e => handleItemChange(i, "qty", e.target.value)}
                    className="border p-2 rounded col-span-2" />
                  <input type="number" min="0" step="0.01" placeholder="Rate" value={item.rate}
                    onChange={e => handleItemChange(i, "rate", e.target.value)}
                    className="border p-2 rounded col-span-3" />
                  <button onClick={() => removeItem(i)} className="bg-red-500 text-white rounded px-2">X</button>
                </div>
              ))}
              <button onClick={addItem} className="text-blue-600 font-medium">+ Add Item</button>
            </div>

            {/* Terms */}
            <div>
              <h3 className="font-semibold mb-3">Notes & Terms</h3>
              <textarea className="border p-2 rounded w-full mb-2" rows="2" value={invoice.notes}
                onChange={e => setInvoice({...invoice, notes: e.target.value})} />
              <textarea className="border p-2 rounded w-full" rows="4" value={invoice.terms}
                onChange={e => setInvoice({...invoice, terms: e.target.value})} />
            </div>

          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
