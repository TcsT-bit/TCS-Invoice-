<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Twinz Invoice Manager</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  body { font-family: 'Inter', sans-serif; }
</style>
</head>
<body class="bg-gray-50">
<div id="root"></div>

<script>
const { useState, useEffect, useRef } = React;
const { jsPDF } = window.jspdf;

// PUT YOUR KEYS HERE. Leave empty for now if you haven't set up EmailJS yet
const EMAILJS_PUBLIC_KEY = "";
const EMAILJS_SERVICE_ID = "";
const EMAILJS_TEMPLATE_ID = "";

function App() {
  const [view, setView] = useState('dashboard');
  const [invoices, setInvoices] = useState([]);
  const [editingInvoice, setEditingInvoice] = useState(null);
  const [emailReady, setEmailReady] = useState(false);
  const invoiceRef = useRef();

  useEffect(() => {
    // Only init EmailJS if key is provided
    if (EMAILJS_PUBLIC_KEY && window.emailjs) {
      emailjs.init(EMAILJS_PUBLIC_KEY);
      setEmailReady(true);
    }

    const saved = localStorage.getItem('twins_invoices');
    if (saved) setInvoices(JSON.parse(saved));
  }, []);

  useEffect(() => {
    localStorage.setItem('twins_invoices', JSON.stringify(invoices));
  }, [invoices]);

  const createNewInvoice = () => {
    const newInv = {
      id: Date.now(),
      invoiceNumber: `INV-${String(invoices.length + 1).padStart(3, '0')}`,
      invoiceDate: new Date().toISOString().split('T')[0],
      dueDate: "",
      status: "Unpaid",
      receivedAmount: 0,
      clientName: "",
      clientEmail: "",
      clientPhone: "",
      clientAddress: "",
      items: [{ desc: "", qty: 1, rate: 0, taxable: true, discount: 0, notes: "" }],
      taxRate: 15,
      notes: "Quotation accepted refer to Ts & Cs below"
    };
    setEditingInvoice(newInv);
    setView('editor');
  };

  const saveInvoice = () => {
    if (invoices.find(i => i.id === editingInvoice.id)) {
      setInvoices(invoices.map(i => i.id === editingInvoice.id? editingInvoice : i));
    } else {
      setInvoices([editingInvoice,...invoices]);
    }
    setView('dashboard');
  };

  const deleteInvoice = (id) => {
    if (confirm("Delete this invoice?")) {
      setInvoices(invoices.filter(i => i.id!== id));
    }
  };

  const editInvoice = (inv) => {
    setEditingInvoice({...inv});
    setView('editor');
  };

  const calculateTotal = (inv) => {
    const subtotal = inv.items.reduce((sum, i) => sum + i.qty * i.rate * (1 - i.discount/100), 0);
    const taxableAmount = inv.items.filter(i => i.taxable).reduce((sum, i) => sum + i.qty * i.rate * (1 - i.discount/100), 0);
    const tax = taxableAmount * (inv.taxRate / 100);
    const balanceDue = Math.max(0, subtotal + tax - inv.receivedAmount);
    return { subtotal, tax, balanceDue };
  };

  const downloadPDF = async (inv) => {
    setEditingInvoice({...inv});
    await new Promise(r => setTimeout(r, 200));
    const doc = new jsPDF('p', 'mm', 'a4');
    await doc.html(invoiceRef.current, { x: 0, y: 0, width: 210, windowWidth: 800 });
    doc.save(`${inv.invoiceNumber}.pdf`);
  };

  const sendEmail = async (inv) => {
    if (!emailReady) {
      alert("Add your EmailJS keys first. Go to emailjs.com and get Public Key, Service ID, Template ID");
      return;
    }
    if (!inv.clientEmail) {
      alert("Add client email first");
      return;
    }
    alert("Email sending... check console if it fails");
    // EmailJS code goes here once keys are added
  };

  // Dashboard View
  if (view === 'dashboard') {
    return React.createElement('div', {className: "min-h-screen p-4 md:p-6"},
      React.createElement('div', {className: "max-w-6xl mx-auto"},
        React.createElement('div', {className: "flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4"},
          React.createElement('div', null,
            React.createElement('h1', {className: "text-3xl font-bold text-gray-800"}, "Invoices"),
            React.createElement('p', {className: "text-gray-600"}, "Manage your invoices")
          ),
          React.createElement('button', {
            onClick: createNewInvoice,
            className: "bg-black text-white px-6 py-3 rounded-lg font-medium hover:bg-gray-800 w-full sm:w-auto"
          }, "+ Create Invoice")
        ),

        invoices.length === 0?
          React.createElement('div', {className: "bg-white rounded-xl shadow p-12 text-center"},
            React.createElement('p', {className: "text-gray-500 mb-4"}, "No invoices yet"),
            React.createElement('button', {
              onClick: createNewInvoice,
              className: "bg-black text-white px-6 py-2 rounded-lg"
            }, "Create your first invoice")
          )
        :
          React.createElement('div', {className: "bg-white rounded-xl shadow overflow-x-auto"},
            React.createElement('table', {className: "w-full min-w-[600px]"},
              React.createElement('thead', {className: "bg-gray-50 text-left"},
                React.createElement('tr', null,
                  ['Invoice #', 'Client', 'Date', 'Amount', 'Status', 'Actions'].map(h =>
                    React.createElement('th', {key: h, className: "p-4 font-semibold text-sm"}, h)
                  )
                )
              ),
              React.createElement('tbody', null,
                invoices.map(inv => {
                  const { balanceDue } = calculateTotal(inv);
                  return React.createElement('tr', {key: inv.id, className: "border-t hover:bg-gray-50"},
                    React.createElement('td', {className: "p-4 font-medium"}, inv.invoiceNumber),
                    React.createElement('td', {className: "p-4"}, inv.clientName || '-'),
                    React.createElement('td', {className: "p-4"}, inv.invoiceDate),
                    React.createElement('td', {className: "p-4 font-semibold"}, `ZAR ${balanceDue.toFixed(2)}`),
                    React.createElement('td', {className: "p-4"},
                      React.createElement('span', {
                        className: `px-3 py-1 rounded-full text-xs font-medium bg-red-100 text-red-700`
                      }, inv.status)
                    ),
                    React.createElement('td', {className: "p-4 space-x-2"},
                      React.createElement('button', {onClick: () => editInvoice(inv), className: "text-blue-600 hover:underline text-sm"}, "Edit"),
                      React.createElement('button', {onClick: () => downloadPDF(inv), className: "text-gray-600 hover:underline text-sm"}, "PDF"),
                      React.createElement('button', {onClick: () => deleteInvoice(inv.id), className: "text-red-600 hover:underline text-sm"}, "Delete")
                    )
                  );
                })
              )
            )
          )
      )
    );
  }

  // Editor View - simplified to prevent crashes
  return React.createElement('div', {className: "min-h-screen p-6"},
    React.createElement('div', {className: "max-w-6xl mx-auto"},
      React.createElement('button', {
        onClick: () => setView('dashboard'),
        className: "mb-4 text-blue-600 hover:underline"
      }, "← Back"),
      React.createElement('div', {className: "bg-white rounded-xl shadow p-6"},
        React.createElement('h2', {className: "text-xl font-bold mb-4"}, "Edit Invoice"),
        React.createElement('input', {
          placeholder: "Client Name",
          value: editingInvoice.clientName,
          onChange: e => setEditingInvoice({...editingInvoice, clientName: e.target.value}),
          className: "w-full border p-3 rounded-lg mb-3"
        }),
        React.createElement('button', {
          onClick: saveInvoice,
          className: "bg-black text-white px-6 py-2 rounded-lg"
        }, "Save Invoice")
      )
    )
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
