<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Twinz Invoice Manager</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  body { font-family: 'Inter', sans-serif; }
  @media print {.no-print { display: none; } }
</style>
</head>
<body class="bg-gray-100">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;
const { jsPDF } = window.jspdf;

// Replace this with your logo base64 or URL
const LOGO = null;

function App() {
  const [view, setView] = useState('dashboard'); // dashboard, editor
  const [invoices, setInvoices] = useState([]);
  const [editingInvoice, setEditingInvoice] = useState(null);
  const invoiceRef = useRef();

  // Load from localStorage on start
  useEffect(() => {
    const saved = localStorage.getItem('twins_invoices');
    if (saved) setInvoices(JSON.parse(saved));

    const company = localStorage.getItem('twins_company');
    if (company) setCompanyInfo(JSON.parse(company));
  }, []);

  // Save to localStorage whenever invoices change
  useEffect(() => {
    localStorage.setItem('twins_invoices', JSON.stringify(invoices));
  }, [invoices]);

  const [companyInfo, setCompanyInfo] = useState({
    name: "Twinz Cooperate Services Pty Ltd",
    regNo: "2024/444303/07",
    vatNo: "9819040198",
    address: "",
    email: "",
    phone: "",
    bankName: "Standard Bank",
    accountNumber: "10 26 459 443 4",
    branchCode: "006145",
    logo: LOGO,
    terms: `Storage fees are charged after 7 business days grace period following the completion of work and storage fee will also apply to clients who leave their vehicle on premises prior to the job after diagnostics have been performed.`
  });

  const createNewInvoice = () => {
    const newInv = {
      id: Date.now(),
      invoiceNumber: `INV-${String(invoices.length + 1).padStart(3, '0')}`,
      invoiceDate: new Date().toISOString().split('T')[0],
      dueDate: "",
      status: "Unpaid",
      receivedAmount: 0,
      clientName: "",
      clientEmail: "",
      clientPhone: "",
      clientAddress: "",
      items: [{ desc: "", qty: 1, rate: 0, taxable: true, discount: 0, notes: "" }],
      taxRate: 15,
      notes: "Quotation accepted refer to Ts & Cs below"
    };
    setEditingInvoice(newInv);
    setView('editor');
  };

  const saveInvoice = () => {
    if (invoices.find(i => i.id === editingInvoice.id)) {
      setInvoices(invoices.map(i => i.id === editingInvoice.id? editingInvoice : i));
    } else {
      setInvoices([editingInvoice,...invoices]);
    }
    setView('dashboard');
  };

  const deleteInvoice = (id) => {
    if (confirm("Delete this invoice?")) {
      setInvoices(invoices.filter(i => i.id!== id));
    }
  };

  const editInvoice = (inv) => {
    setEditingInvoice({...inv});
    setView('editor');
  };

  const generatePDF = async (inv) => {
    setEditingInvoice({...inv});
    await new Promise(r => setTimeout(r, 100)); // wait for render

    const doc = new jsPDF('p', 'mm', 'a4');
    await doc.html(invoiceRef.current, { x: 0, y: 0, width: 210, windowWidth: 800 });
    return doc;
  };

  const downloadPDF = async (inv) => {
    const doc = await generatePDF(inv);
    doc.save(`${inv.invoiceNumber}_${inv.clientName || 'Invoice'}.pdf`);
  };

  const shareWhatsApp = async (inv) => {
    const message = `Invoice ${inv.invoiceNumber} from ${companyInfo.name}\nClient: ${inv.clientName}\nAmount Due: ZAR ${calculateTotal(inv).balanceDue.toFixed(2)}`;
    if (navigator.share && navigator.canShare) {
      const pdfBlob = await (await generatePDF(inv)).output('blob');
      const file = new File([pdfBlob], `Invoice-${inv.invoiceNumber}.pdf`, { type: 'application/pdf' });
      try {
        await navigator.share({ files:, title: `Invoice ${inv.invoiceNumber}`, text: message });
        return;
      } catch {}
    }
    window.open(`https://wa.me/?text=${encodeURIComponent(message)}`, '_blank');
    alert("PDF will download. Attach it to WhatsApp.");
    await downloadPDF(inv);
  };

  const calculateTotal = (inv) => {
    const subtotal = inv.items.reduce((sum, i) => sum + i.qty * i.rate * (1 - i.discount/100), 0);
    const taxableAmount = inv.items.filter(i => i.taxable).reduce((sum, i) => sum + i.qty * i.rate * (1 - i.discount/100), 0);
    const tax = taxableAmount * (inv.taxRate / 100);
    const total = subtotal + tax;
    const balanceDue = Math.max(0, total - inv.receivedAmount);
    return { subtotal, tax, total, balanceDue };
  };

  // Dashboard View
  if (view === 'dashboard') {
    return (
      <div className="min-h-screen p-6">
        <div className="max-w-6xl mx-auto">
          <div className="flex justify-between items-center mb-6">
            <div>
              <h1 className="text-3xl font-bold text-gray-800">Invoices</h1>
              <p className="text-gray-600">Manage your invoices</p>
            </div>
            <button onClick={createNewInvoice}
              className="bg-black text-white px-6 py-3 rounded-lg font-medium hover:bg-gray-800">
              + Create Invoice
            </button>
          </div>

          {invoices.length === 0? (
            <div className="bg-white rounded-xl shadow p-12 text-center">
              <p className="text-gray-500 mb-4">No invoices yet</p>
              <button onClick={createNewInvoice}
                className="bg-black text-white px-6 py-2 rounded-lg">Create your first invoice</button>
            </div>
          ) : (
            <div className="bg-white rounded-xl shadow overflow-hidden">
              <table className="w-full">
                <thead className="bg-gray-50 text-left">
                  <tr>
                    <th className="p-4 font-semibold">Invoice #</th>
                    <th className="p-4 font-semibold">Client</th>
                    <th className="p-4 font-semibold">Date</th>
                    <th className="p-4 font-semibold">Amount</th>
                    <th className="p-4 font-semibold">Status</th>
                    <th className="p-4 font-semibold">Actions</th>
                  </tr>
                </thead>
                <tbody>
                  {invoices.map(inv => {
                    const { balanceDue } = calculateTotal(inv);
                    return (
                      <tr key={inv.id} className="border-t hover:bg-gray-50">
                        <td className="p-4 font-medium">{inv.invoiceNumber}</td>
                        <td className="p-4">{inv.clientName || '-'}</td>
                        <td className="p-4">{inv.invoiceDate}</td>
                        <td className="p-4 font-semibold">ZAR {balanceDue.toFixed(2)}</td>
                        <td className="p-4">
                          <span className={`px-3 py-1 rounded-full text-sm ${
                            inv.status === 'Paid'? 'bg-green-100 text-green-700' :
                            inv.status === 'Partially Paid'? 'bg-yellow-100 text-yellow-700' :
                            'bg-red-100 text-red-700'
                          }`}>{inv.status}</span>
                        </td>
                        <td className="p-4 space-x-2">
                          <button onClick={() => editInvoice(inv)} className="text-blue-600 hover:underline">Edit</button>
                          <button onClick={() => downloadPDF(inv)} className="text-gray-600 hover:underline">PDF</button>
                          <button onClick={() => shareWhatsApp(inv)} className="text-green-600 hover:underline">Share</button>
                          <button onClick={() => deleteInvoice(inv.id)} className="text-red-600 hover:underline">Delete</button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
        </div>
      </div>
    );
  }

  // Editor View
  const updateItem = (i, field, value) => {
    const newItems = [...editingInvoice.items];
    newItems[i][field] = field === 'desc' || field === 'notes'? value : Number(value);
    setEditingInvoice({...editingInvoice, items: newItems});
  };

  const addItem = () => {
    setEditingInvoice({
     ...editingInvoice,
      items: [...editingInvoice.items, { desc: "", qty: 1, rate: 0, taxable: true, discount: 0, notes: "" }]
    });
  };

  const removeItem = (i) => {
    setEditingInvoice({...editingInvoice, items: editingInvoice.items.filter((_, idx) => idx!== i)});
  };

  const { subtotal, tax, total, balanceDue } = calculateTotal(editingInvoice);

  return (
    <div className="min-h-screen">
      {/* Editor Header */}
      <div className="bg-white shadow-sm sticky top-0 z-10 no-print">
        <div className="max-w-6xl mx-auto p-4 flex justify-between items-center">
          <button onClick={() => setView('dashboard')} className="text-gray-600 hover:text-black">← Back</button>
          <div className="space-x-2">
            <button onClick={saveInvoice} className="bg-black text-white px-6 py-2 rounded-lg font-medium">Save Invoice</button>
          </div>
        </div>
      </div>

      <div className="max-w-6xl mx-auto p-6 grid lg:grid-cols-2 gap-6">

        {/* Left: Editor Form */}
        <div className="space-y-4 no-print">

          {/* Client Info */}
          <div className="bg-white rounded-xl shadow p-6">
            <h3 className="font-semibold mb-4">Client Details</h3>
            <input placeholder="Client Name" value={editingInvoice.clientName}
              onChange={e => setEditingInvoice({...editingInvoice, clientName: e.target.value})}
              className="w-full border p-3 rounded-lg mb-3" />
            <div className="grid grid-cols-2 gap-3">
              <input placeholder="Email" value={editingInvoice.clientEmail}
                onChange={e => setEditingInvoice({...editingInvoice, clientEmail: e.target.value})}
                className="border p-3 rounded-lg" />
              <input placeholder="Phone" value={editingInvoice.clientPhone}
                onChange={e => setEditingInvoice({...editingInvoice, clientPhone: e.target.value})}
                className="border p-3 rounded-lg" />
            </div>
            <input placeholder="Address" value={editingInvoice.clientAddress}
              onChange={e => setEditingInvoice({...editingInvoice, clientAddress: e.target.value})}
              className="w-full border p-3 rounded-lg mt-3" />
          </div>

          {/* Invoice Details */}
          <div className="bg-white rounded-xl shadow p-6">
            <h3 className="font-semibold mb-4">Invoice Details</h3>
            <div className="grid grid-cols-2 gap-3">
              <input placeholder="Invoice #" value={editingInvoice.invoiceNumber}
                onChange={e => setEditingInvoice({...editingInvoice, invoiceNumber: e.target.value})}
                className="border p-3 rounded-lg" />
              <input type="date" value={editingInvoice.invoiceDate}
                onChange={e => setEditingInvoice({...editingInvoice, invoiceDate: e.target.value})}
                className="border p-3 rounded-lg" />
            </div>
            <div className="grid grid-cols-2 gap-3 mt-3">
              <input type="date" placeholder="Due Date" value={editingInvoice.dueDate}
                onChange={e => setEditingInvoice({...editingInvoice, dueDate: e.target.value})}
                className="border p-3 rounded-lg" />
              <select value={editingInvoice.status}
                onChange={e => setEditingInvoice({...editingInvoice, status: e.target.value})}
                className="border p-3 rounded-lg">
                <option>Unpaid</option>
                <option>Partially Paid</option>
                <option>Paid</option>
              </select>
            </div>
          </div>

          {/* Items - Mobile friendly like your screenshot */}
          <div className="bg-white rounded-xl shadow p-6">
            <h3 className="font-semibold mb-4">Items</h3>
            {editingInvoice.items.map((item, i) => (
              <div key={i} className="border rounded-lg p-4 mb-3">
                <input placeholder="Item or service provided" value={item.desc}
                  onChange={e => updateItem(i, 'desc', e.target.value)}
                  className="w-full border-b pb-2 mb-3 focus:outline-none" />

                <textarea placeholder="Notes (optional)" value={item.notes}
                  onChange={e => updateItem(i, 'notes', e.target.value)}
                  className="w-full text-sm text-gray-600 mb-3 focus:outline-none" rows="2" />

                <div className="grid grid-cols-2 gap-4">
                  <div>
                    <label className="text-sm text-gray-500">Price</label>
                    <input type="number" value={item.rate}
                      onChange={e => updateItem(i, 'rate', e.target.value)}
                      className="w-full border-b pb-1 focus:outline-none" />
                  </div>
                  <div>
                    <label className="text-sm text-gray-500">Quantity</label>
                    <input type="number" value={item.qty}
                      onChange={e => updateItem(i, 'qty', e.target.value)}
                      className="w-full border-b pb-1 focus:outline-none" />
                  </div>
                </div>

                <div className="flex gap-2 mt-3">
                  <button onClick={() => updateItem(i, 'discount', item.discount? 0 : 10)}
                    className={`px-4 py-2 rounded-full text-sm border ${item.discount? 'bg-gray-100' : ''}`}>
                    + Discount
                  </button>
                  <button onClick={() => updateItem(i, 'taxable',!item.taxable)}
                    className={`px-4 py-2 rounded-full text-sm ${item.taxable? 'bg-green-100 text-green-700' : 'border'}`}>
                    ✓ Taxable
                  </button>
                </div>

                <button onClick={() => removeItem(i)}
                  className="text-red-600 text-sm mt-4 flex items-center gap-2">
                  🗑 Delete from invoice
                </button>
              </div>
            ))}
            <button onClick={addItem}
              className="w-full bg-black text-white py-3 rounded-lg font-medium mt-4">
              Save Item
            </button>
          </div>

          {/* Notes */}
          <div className="bg-white rounded-xl shadow p-6">
            <h3 className="font-semibold mb-3">Notes</h3>
            <textarea value={editingInvoice.notes}
              onChange={e => setEditingInvoice({...editingInvoice, notes: e.target.value})}
              className="w-full border p-3 rounded-lg" rows="3" />
          </div>
        </div>

        {/* Right: Live Preview */}
        <div className="bg-white rounded-xl shadow p-8 sticky top-24 h-fit">
          <div ref={invoiceRef}>
            {/* Header */}
            <div className="flex justify-between mb-8">
              <div>
                {companyInfo.logo && <img src={companyInfo.logo} className="h-12 mb-2" />}
                <h2 className="text-xl font-bold">{companyInfo.name}</h2>
                <p className="text-sm text-gray-600">Reg: {companyInfo.regNo} | VAT: {companyInfo.vatNo}</p>
              </div>
              <div className="text-right">
                <h1 className="text-3xl font-bold">INVOICE</h1>
                <p className="text-gray-600">#{editingInvoice.invoiceNumber}</p>
              </div>
            </div>

            {/* Bill To */}
            <div className="mb-6">
              <p className="text-sm text-gray-500">Bill To</p>
              <p className="font-semibold">{editingInvoice.clientName || 'Client Name'}</p>
              <p className="text-sm">{editingInvoice.clientAddress}</p>
            </div>

            {/* Items Table */}
            <table className="w-full text-sm mb-6">
              <thead className="bg-gray-50">
                <tr>
                  <th className="text-left p-2">Description</th>
                  <th className="text-right p-2">Qty</th>
                  <th className="text-right p-2">Rate</th>
                  <th className="text-right p-2">Amount</th>
                </tr>
              </thead>
              <tbody>
                {editingInvoice.items.map((item, i) => (
                  <tr key={i} className="border-b">
                    <td className="p-2">
                      {item.desc || '-'}
                      {item.notes && <p className="text-xs text-gray-500">{item.notes}</p>}
                    </td>
                    <td className="p-2 text-right">{item.qty}</td>
                    <td className="p-2 text-right">ZAR {item.rate.toFixed(2)}</td>
                    <td className="p-2 text-right">ZAR {(item.qty * item.rate * (1 - item.discount/100)).toFixed(2)}</td>
                  </tr>
                ))}
              </tbody>
            </table>

            {/* Totals */}
            <div className="flex justify-end">
              <div className="w-64 space-y-2">
                <div className="flex justify-between"><span>Subtotal</span><span>ZAR {subtotal.toFixed(2)}</span></div>
                <div className="flex justify-between"><span>VAT {editingInvoice.taxRate}%</span><span>ZAR {tax.toFixed(2)}</span></div>
                <div className="flex justify-between font-bold border-t pt-2">
                  <span>Balance Due</span><span>ZAR {balanceDue.toFixed(2)}</span>
                </div>
              </div>
            </div>

            {/* Terms */}
            <div className="mt-8 pt-6 border-t">
              <p className="font-semibold mb-2">Terms & Conditions</p>
              <p className="text-sm text-gray-600">{companyInfo.terms}</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
