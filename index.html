<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Twinz Invoice Manager</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
  body {
    background: #f9fafb;
    font-family: 'Inter', system-ui, sans-serif;
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
const { useState, useEffect, useRef } = React;
const { jsPDF } = window.jspdf;

// REPLACE THESE 3 with your EmailJS keys. Leave blank if you don't want email yet
const EMAILJS_PUBLIC_KEY = "";
const EMAILJS_SERVICE_ID = "";
const EMAILJS_TEMPLATE_ID = "";

function App() {
  const [view, setView] = useState('dashboard');
  const [invoices, setInvoices] = useState([]);
  const [editingInvoice, setEditingInvoice] = useState(null);
  const [sending, setSending] = useState(false);
  const invoiceRef = useRef();

  useEffect(() => {
    if (EMAILJS_PUBLIC_KEY && window.emailjs) {
      emailjs.init(EMAILJS_PUBLIC_KEY);
    }
    const saved = localStorage.getItem('twins_invoices');
    if (saved) setInvoices(JSON.parse(saved));
  }, []);

  useEffect(() => {
    localStorage.setItem('twins_invoices', JSON.stringify(invoices));
  }, [invoices]);

  const [companyInfo] = useState({
    name: "Twinz Cooperate Services Pty Ltd",
    regNo: "2024/444303/07",
    vatNo: "9819040198",
    email: "info@twinscooperate.co.za",
    phone: "069 894 9596",
    bankName: "Standard Bank",
    accountNumber: "10 26 459 443 4",
    branchCode: "006145",
    logo: null,
    terms: "Storage fees are charged after 7 business days grace period following the completion of work."
  });

  const createNewInvoice = () => {
    const newInv = {
      id: Date.now(),
      invoiceNumber: `INV-${String(invoices.length + 1).padStart(3, '0')}`,
      invoiceDate: new Date().toISOString().split('T')[0],
      dueDate: "",
      status: "Unpaid",
      receivedAmount: 0,
      clientName: "",
      clientEmail: "",
      clientPhone: "",
      clientAddress: "",
      items: [{ desc: "", qty: 1, rate: 0, taxable: true, discount: 0, notes: "" }],
      taxRate: 15,
      notes: "Quotation accepted refer to Ts & Cs below"
    };
    setEditingInvoice(newInv);
    setView('editor');
  };

  const saveInvoice = () => {
    if (invoices.find(i => i.id === editingInvoice.id)) {
      setInvoices(invoices.map(i => i.id === editingInvoice.id? editingInvoice : i));
    } else {
      setInvoices([editingInvoice,...invoices]);
    }
    setView('dashboard');
  };

  const deleteInvoice = (id) => {
    if (confirm("Delete this invoice?")) {
      setInvoices(invoices.filter(i => i.id!== id));
    }
  };

  const editInvoice = (inv) => {
    setEditingInvoice({...inv});
    setView('editor');
  };

  const calculateTotal = (inv) => {
    const subtotal = inv.items.reduce((sum, i) => sum + i.qty * i.rate * (1 - i.discount/100), 0);
    const taxableAmount = inv.items.filter(i => i.taxable).reduce((sum, i) => sum + i.qty * i.rate * (1 - i.discount/100), 0);
    const tax = taxableAmount * (inv.taxRate / 100);
    const total = subtotal + tax;
    const balanceDue = Math.max(0, total - inv.receivedAmount);
    return { subtotal, tax, total, balanceDue };
  };

  const generatePDFBlob = async (inv) => {
    setEditingInvoice({...inv});
    await new Promise(r => setTimeout(r, 200));
    const doc = new jsPDF('p', 'mm', 'a4');
    await doc.html(invoiceRef.current, { x: 0, y: 0, width: 210, windowWidth: 800 });
    return doc.output('blob');
  };

  const downloadPDF = async (inv) => {
    const blob = await generatePDFBlob(inv);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${inv.invoiceNumber}.pdf`;
    a.click();
    URL.revokeObjectURL(url);
  };

  // Share function - uses Web Share API like your CliniqueConnect WhatsApp button
  const shareInvoice = async (inv) => {
    const { balanceDue } = calculateTotal(inv);
    const message = `Invoice ${inv.invoiceNumber} from ${companyInfo.name}\nClient: ${inv.clientName}\nAmount Due: ZAR ${balanceDue.toFixed(2)}\n\nSent via Twinz Invoice Manager`;

    // Try native share with file attachment first
    if (navigator.share && navigator.canShare) {
      try {
        const pdfBlob = await generatePDFBlob(inv);
        const file = new File([pdfBlob], `${inv.invoiceNumber}.pdf`, { type: 'application/pdf' });
        if (navigator.canShare({ files: })) {
          await navigator.share({
            files:,
            title: `Invoice ${inv.invoiceNumber}`,
            text: message
          });
          return;
        }
      } catch (err) {
        console.log('Share failed, falling back to WhatsApp');
      }
    }

    // Fallback: WhatsApp like your reportIssue function
    const waMsg = encodeURIComponent(message);
    window.open(`https://wa.me/?text=${waMsg}`, '_blank');
    alert("PDF will download. Attach it to WhatsApp.");
    await downloadPDF(inv);
  };

  const sendEmail = async (inv) => {
    if (!EMAILJS_PUBLIC_KEY) {
      alert("Add your EmailJS keys first to enable email sending");
      return;
    }
    if (!inv.clientEmail) {
      alert("Add client email first");
      return;
    }
    setSending(true);
    try {
      const pdfBlob = await generatePDFBlob(inv);
      const reader = new FileReader();
      reader.readAsDataURL(pdfBlob);
      reader.onloadend = async () => {
        const base64data = reader.result;
        const { balanceDue } = calculateTotal(inv);
        await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
          to_email: inv.clientEmail,
          to_name: inv.clientName,
          from_name: companyInfo.name,
          invoice_number: inv.invoiceNumber,
          amount: balanceDue.toFixed(2),
          message: inv.notes,
          attachment: base64data
        });
        alert(`Invoice sent to ${inv.clientEmail}`);
        setSending(false);
      };
    } catch (err) {
      alert("Failed to send: " + err.message);
      setSending(false);
    }
  };

  const updateItem = (i, field, value) => {
    const newItems = [...editingInvoice.items];
    newItems[i][field] = field === 'desc' || field === 'notes'? value : Number(value);
    setEditingInvoice({...editingInvoice, items: newItems});
  };

  const addItem = () => {
    setEditingInvoice({
    ...editingInvoice,
      items: [...editingInvoice.items, { desc: "", qty: 1, rate: 0, taxable: true, discount: 0, notes: "" }]
    });
  };

  const removeItem = (i) => {
    setEditingInvoice({...editingInvoice, items: editingInvoice.items.filter((_, idx) => idx!== i)});
  };

  // Dashboard View
  if (view === 'dashboard') {
    return React.createElement('div', {className: "min-h-screen p-4 md:p-6"},
      React.createElement('div', {className: "max-w-6xl mx-auto"},
        React.createElement('div', {className: "flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4"},
          React.createElement('div', null,
            React.createElement('h1', {className: "text-3xl font-bold text-gray-800"}, "Invoices"),
            React.createElement('p', {className: "text-gray-600"}, "Twinz Cooperate Services")
          ),
          React.createElement('button', {
            onClick: createNewInvoice,
            className: "bg-black text-white px-6 py-3 rounded-lg font-medium hover:bg-gray-800 w-full sm:w-auto"
          }, "+ Create Invoice")
        ),

        invoices.length === 0?
          React.createElement('div', {className: "bg-white rounded-xl shadow p-12 text-center"},
            React.createElement('p', {className: "text-gray-500 mb-4"}, "No invoices yet"),
            React.createElement('button', {
              onClick: createNewInvoice,
              className: "bg-black text-white px-6 py-2 rounded-lg"
            }, "Create your first invoice")
          )
        :
          React.createElement('div', {className: "bg-white rounded-xl shadow overflow-x-auto"},
            React.createElement('table', {className: "w-full min-w-[700px]"},
              React.createElement('thead', {className: "bg-gray-50 text-left"},
                React.createElement('tr', null,
                  ['Invoice #', 'Client', 'Date', 'Amount', 'Status', 'Actions'].map(h =>
                    React.createElement('th', {key: h, className: "p-4 font-semibold text-sm"}, h)
                  )
                )
              ),
              React.createElement('tbody', null,
                invoices.map(inv => {
                  const { balanceDue } = calculateTotal(inv);
                  return React.createElement('tr', {key: inv.id, className: "border-t hover:bg-gray-50"},
                    React.createElement('td', {className: "p-4 font-medium"}, inv.invoiceNumber),
                    React.createElement('td', {className: "p-4"}, inv.clientName || '-'),
                    React.createElement('td', {className: "p-4"}, inv.invoiceDate),
                    React.createElement('td', {className: "p-4 font-semibold"}, `ZAR ${balanceDue.toFixed(2)}`),
                    React.createElement('td', {className: "p-4"},
                      React.createElement('span', {
                        className: `px-3 py-1 rounded-full text-xs font-medium ${
                          inv.status === 'Paid'? 'bg-green-100 text-green-700' :
                          inv.status === 'Partially Paid'? 'bg-yellow-100 text-yellow-700' :
                          'bg-red-100 text-red-700'
                        }`
                      }, inv.status)
                    ),
                    React.createElement('td', {className: "p-4 space-x-2 whitespace-nowrap"},
                      React.createElement('button', {onClick: () => editInvoice(inv), className: "text-blue-600 hover:underline text-sm"}, "Edit"),
                      React.createElement('button', {onClick: () => downloadPDF(inv), className: "text-gray-600 hover:underline text-sm"}, "PDF"),
                      React.createElement('button', {onClick: () => shareInvoice(inv), className: "text-green-600 hover:underline text-sm"}, "Share"),
                      React.createElement('button', {onClick: () => sendEmail(inv), disabled: sending, className: "text-purple-600 hover:underline text-sm disabled:opacity-50"},
                        sending? "Sending..." : "Email"
                      ),
                      React.createElement('button', {onClick: () => deleteInvoice(inv.id), className: "text-red-600 hover:underline text-sm"}, "Delete")
                    )
                  );
                })
              )
            )
          )
      )
    );
  }

  // Editor View
  const { subtotal, tax, balanceDue } = calculateTotal(editingInvoice);

  return React.createElement('div', {className: "min-h-screen"},
    React.createElement('div', {className: "bg-white shadow-sm sticky top-0 z-10"},
      React.createElement('div', {className: "max-w-6xl mx-auto p-4 flex justify-between items-center"},
        React.createElement('button', {onClick: () => setView('dashboard'), className: "text-gray-600 hover:text-black font-medium"}, "← Back"),
        React.createElement('button', {onClick: saveInvoice, className: "bg-black text-white px-6 py-2 rounded-lg font-medium"}, "Save Invoice")
      )
    ),

    React.createElement('div', {className: "max-w-6xl mx-auto p-4 md:p-6 grid lg:grid-cols-2 gap-6"},

      React.createElement('div', {className: "space-y-4"},
        React.createElement('div', {className: "bg-white rounded-xl shadow p-6"},
          React.createElement('h3', {className: "font-semibold mb-4"}, "Client Details"),
          React.createElement('input', {
            placeholder: "Client Name",
            value: editingInvoice.clientName,
            onChange: e => setEditingInvoice({...editingInvoice, clientName: e.target.value}),
            className: "w-full border p-3 rounded-lg mb-3"
          }),
          React.createElement('div', {className: "grid grid-cols-2 gap-3"},
            React.createElement('input', {
              placeholder: "Email",
              value: editingInvoice.clientEmail,
              onChange: e => setEditingInvoice({...editingInvoice, clientEmail: e.target.value}),
              className: "border p-3 rounded-lg"
            }),
            React.createElement('input', {
              placeholder: "Phone",
              value: editingInvoice.clientPhone,
              onChange: e => setEditingInvoice({...editingInvoice, clientPhone: e.target.value}),
              className: "border p-3 rounded-lg"
            })
          )
        ),

        React.createElement('div', {className: "bg-white rounded-xl shadow p-6"},
          React.createElement('h3', {className: "font-semibold mb-4"}, "Items"),
          editingInvoice.items.map((item, i) =>
            React.createElement('div', {key: i, className: "border rounded-lg p-4 mb-3"},
              React.createElement('input', {
                placeholder: "Item or service provided",
                value: item.desc,
                onChange: e => updateItem(i, 'desc', e.target.value),
                className: "w-full border-b pb-2 mb-3 focus:outline-none"
              }),
              React.createElement('div', {className: "grid grid-cols-2 gap-4"},
                React.createElement('input', {
                  type: "number",
                  placeholder: "Price",
                  value: item.rate,
                  onChange: e => updateItem(i, 'rate', e.target.value),
                  className: "border-b pb-1 focus:outline-none"
                }),
                React.createElement('input', {
                  type: "number",
                  placeholder: "Qty",
                  value: item.qty,
                  onChange: e => updateItem(i, 'qty', e.target.value),
                  className: "border-b pb-1 focus:outline-none"
                })
              ),
              React.createElement('button', {
                onClick: () => removeItem(i),
                className: "text-red-600 text-sm mt-3"
              }, "Delete item")
            )
          ),
          React.createElement('button', {
            onClick: addItem,
            className: "w-full bg-black text-white py-3 rounded-lg font-medium mt-4"
          }, "Add Item")
        )
      ),

      React.createElement('div', {className: "bg-white rounded-xl shadow p-6 sticky top-24 h-fit"},
        React.createElement('div', {ref: invoiceRef},
          React.createElement('div', {className: "flex justify-between mb-8"},
            React.createElement('div', null,
              React.createElement('h2', {className: "text-xl font-bold"}, companyInfo.name),
              React.createElement('p', {className: "text-sm text-gray-600"}, `Reg: ${companyInfo.regNo}`)
            ),
            React.createElement('div', {className: "text-right"},
              React.createElement('h1', {className: "text-3xl font-bold"}, "INVOICE"),
              React.createElement('p', {className: "text-gray-600"}, `#${editingInvoice.invoiceNumber}`)
            )
          ),

          React.createElement('div', {className: "mb-6"},
            React.createElement('p', {className: "text-sm text-gray-500"}, "Bill To"),
            React.createElement('p', {className: "font-semibold"}, editingInvoice.clientName || 'Client Name')
          ),

          React.createElement('table', {className: "w-full text-sm mb-6"},
            React.createElement('thead', {className: "bg-gray-50"},
              React.createElement('tr', null,
                React.createElement('th', {className: "text-left p-2"}, "Description"),
                React.createElement('th', {className: "text-right p-2"}, "Qty"),
                React.createElement('th', {className: "text-right p-2"}, "Rate"),
                React.createElement('th', {className: "text-right p-2"}, "Amount")
              )
            ),
            React.createElement('tbody', null,
              editingInvoice.items.map((item, i) =>
                React.createElement('tr', {key: i, className: "border-b"},
                  React.createElement('td', {className: "p-2"}, item.desc || '-'),
                  React.createElement('td', {className: "p-2 text-right"}, item.qty),
                  React.createElement('td', {className: "p-2 text-right"}, `ZAR ${item.rate.toFixed(2)}`),
                  React.createElement('td', {className: "p-2 text-right"}, `ZAR ${(item.qty * item.rate * (1 - item.discount/100)).toFixed(2)}`)
                )
              )
            )
          ),

          React.createElement('div', {className: "flex justify-end"},
            React.createElement('div', {className: "w-64 space-y-2"},
              React.createElement('div', {className: "flex justify-between font-bold border-t pt-2"},
                React.createElement('span', null, "Balance Due"),
                React.createElement('span', null, `ZAR ${balanceDue.toFixed(2)}`)
              )
            )
          )
        )
      )
    )
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
